<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>macPaint</title>
  <link rel="icon" href="assets/logo.svg" type="image/svg+xml">
  <link rel="stylesheet" href="src/ui.css">
  <link rel="stylesheet" href="src/svg/editor.css">
  <link rel="stylesheet" href="src/app.css">
</head>
<body>
  <header class="mp-head">
    <div class="brand"><img class="logo" src="assets/logo.svg" alt="" width="22" height="22"><b>macPaint</b></div>
    <nav class="tabs" role="tablist">
      <button type="button" role="tab" data-mode="png" class="on"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="2.500" width="12" height="11" rx="2"/><circle cx="6" cy="6.500" r="1.200"/><path d="M2.500 12l3.500-3.500 3 3 2-2 2.500 2.500"/></svg>PNG 편집기</button>
      <button type="button" role="tab" data-mode="svg"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12.500C4 5 12 5 13 12.500"/><rect x="1.800" y="11.300" width="2.400" height="2.400" rx=".5"/><rect x="11.800" y="11.300" width="2.400" height="2.400" rx=".5"/></svg>SVG 편집기</button>
    </nav>
    <div class="end"><a id="dmg" class="dl" href="downloads/macPaint.dmg" download>macOS용 다운로드</a></div>
  </header>
  <main>
    <section id="png" class="pane"></section>
    <section id="svg" class="pane" hidden></section>
  </main>
  <script type="module" src="src/app.js"></script>
</body>
</html>
