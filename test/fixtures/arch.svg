<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="640" height="420" viewBox="0 0 640 420" font-family="Helvetica, Arial, sans-serif" font-size="12">
  <title>실행기 아키텍처</title>
  <style>
    .box { fill: #e6eef0; stroke: #2a7a85; stroke-width: 1.5; }
    .ext { fill: #fbe9df; stroke: #d9743f; stroke-width: 1.5; }
    .lbl { text-anchor: middle; fill: #1d1d1f; }
    .wire { stroke: #333; stroke-width: 1; fill: none; marker-end: url(#arr); }
    .dash { stroke-dasharray: 5 3; }
  </style>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#333"/></marker>
    <linearGradient id="g1" x1="0" x2="0" y1="0" y2="1"><stop offset="0" stop-color="#cfe3e6"/><stop offset="1" stop-color="#8fb9bf"/></linearGradient>
  </defs>
  <rect x="10" y="10" width="620" height="110" rx="10" fill="none" stroke="#999"/>
  <g id="n1" transform="translate(30 30)"><rect class="box" width="150" height="60" rx="6"/><text class="lbl" x="75" y="26">역할 지시<tspan x="75" dy="16">정체성 · 할 일</tspan></text></g>
  <g id="n2"><rect class="box" x="230" y="30" width="150" height="60" rx="6"/><text class="lbl" x="305" y="54">공급 규범</text></g>
  <g id="db"><path d="M440 40v40c0 8 60 8 60 0v-40" fill="url(#g1)" stroke="#2a7a85"/><ellipse cx="470" cy="40" rx="30" ry="8" fill="#e6eef0" stroke="#2a7a85"/><text class="lbl" x="470" y="66">결합 레코드</text></g>
  <path class="wire" d="M105 90 V160 H305 V200"/>
  <path class="wire dash" d="M305 90 V140 H470 V200"/>
  <g class="ext"><rect class="ext" x="230" y="200" width="150" height="50" rx="6"/><text class="lbl" x="305" y="230">언어모델 서버</text></g>
  <g transform="rotate(-8 500 300)"><rect x="440" y="270" width="120" height="50" fill="#fff" stroke="#111" stroke-width="2"/><text x="450" y="300" font-size="16" font-weight="bold">회전됨</text></g>
  <text x="30" y="400" fill="#888">바깥 · 외부 자원 → 발췌 규칙으로 변환</text>
  <script>alert(1)</script>
</svg>
